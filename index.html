<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แล็บสมดุลเคมี · ทำด้วยตนเอง</title>
<style>
  :root { --bg: #fffdf6; --ink: #161412; --soft: #5b544a; --teal: #0b7d70; --yellow: #ffe84d; --pink: #c0245f; --line: #16141233; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 18px/1.6 "Bai Jamjuree", "Sarabun", "Noto Sans Thai", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 36px 20px 60px; }
  h1 { font-size: 34px; line-height: 1.25; margin: 0 0 6px; }
  h1 span { background: var(--yellow); padding: 0 8px; }
  p.lead { color: var(--soft); margin: 0 0 28px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  li a { display: block; text-decoration: none; color: inherit; border: 2px solid var(--ink); border-radius: 14px; padding: 14px 18px; background: #fff; box-shadow: 4px 4px 0 var(--ink); transition: transform .15s; }
  li a:hover, li a:focus-visible { transform: translate(-2px, -2px); outline: 3px solid var(--pink); outline-offset: 3px; }
  li b { display: block; font-size: 22px; }
  li small { color: var(--soft); font-size: 16px; }
  .tag { display: inline-block; font-size: 14px; color: #fff; background: var(--teal); border-radius: 999px; padding: 0 10px; margin-right: 8px; vertical-align: 2px; }
  li .lock { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 14px 18px; color: var(--soft); background: transparent; }
  li .lock b { color: var(--soft); }
  footer { margin-top: 30px; color: var(--soft); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>แล็บ<span>สมดุลเคมี</span> ทำด้วยตนเอง</h1>
  <p class="lead">เลือกแล็บ แล้วทำตามขั้นตอนบนหน้าจอ กดขวดสารเพื่อหยด กดหลอดเพื่อเลือก ใช้ปุ่ม ← → เปลี่ยนหน้า (เปิดบนคอมพิวเตอร์หรือแท็บเล็ตแนวนอนจะดูง่ายที่สุด)</p>
  <ol id="list"><li style="color:var(--soft)">กำลังโหลดรายการแล็บ…</li></ol>
  <footer>สมดุลเคมี · เคมี ม.5 เทอม 2</footer>
</main>
<script>
fetch('labs.json').then(r => r.json()).then(d => {
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  document.getElementById('list').innerHTML = d.labs.map(l => {
    const head = '<b><span class="tag">' + esc(l.tag) + '</span>' + esc(l.title) + '</b>';
    return l.open
      ? '<li><a href="equilibrium.html?lab=' + encodeURIComponent(l.slides).replace(/%2C/g, ',') + '">' + head + '<small>' + esc(l.desc) + '</small></a></li>'
      : '<li><span class="lock">' + head + '<small>🔒 ยังไม่เปิด · รอครูปลดล็อกในคาบเรียน</small></span></li>';
  }).join('');
}).catch(() => { document.getElementById('list').innerHTML = '<li>โหลดรายการแล็บไม่สำเร็จ ลองรีเฟรชหน้านี้</li>'; });
</script>
</body>
</html>
